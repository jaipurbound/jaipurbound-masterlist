<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaipur Bound — Post Masterlist</title>
<style>
  :root { color-scheme: light; --ink:#24211f; --muted:#77716b; --line:#e6e0d9; --paper:#fbf9f5; --accent:#a3442b; --accent-light:#f3e7df; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  header { max-width:1080px; margin:auto; padding:36px 24px 16px; }
  h1 { margin:0; font-size:clamp(2rem, 5vw, 3.5rem); letter-spacing:-.03em; }
  .intro { color: var(--muted); margin-top: 8px; }
  .toolbar { position:sticky; top:0; z-index:5; padding:12px 24px; background:rgba(251,249,245,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .toolbar-inner { max-width:1032px; margin:auto; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  input { flex:1 1 280px; padding:12px 14px; border:1px solid #d8d0c7; border-radius:8px; font:inherit; background:white; }
  .count { color:var(--muted); font-size:.9rem; }
  main { max-width:1080px; margin:auto; padding:24px; display:grid; grid-template-columns:repeat(auto-fit, minmax(480px, 1fr)); gap:24px; align-items:start; }
  .category-box { border:1px solid var(--line); border-radius:12px; background:white; overflow:hidden; }
  .category-header { display:flex; align-items:center; justify-content:space-between; margin:0; padding:16px 20px; border-bottom:1px solid var(--line); font-size:1.15rem; background:#faf8f4; }
  .category-header span { padding:2px 10px; border-radius:999px; background:var(--accent-light); color:var(--accent); font-size:.8rem; font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  th { padding:10px 16px; background:#faf8f4; color:var(--muted); text-align:left; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { width:50px; text-align:center; color:var(--muted); font-size:.85rem; }
  td { padding:12px 16px; border-top:1px solid #f2ede9; vertical-align:top; }
  td a { color:var(--ink); text-decoration-color:#d6b3a4; text-underline-offset:3px; }
  td a:hover { color:var(--accent); }
  .category-box[hidden], tr[hidden] { display:none; }
  @media(max-width:600px) { main { grid-template-columns:1fr; padding:12px; } }
</style>
</head>
<body>

<header>
  <h1>The post masterlist.</h1>
  <p class="intro">Every post organized by category. Click any post to open it on Instagram.</p>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <input id="search" type="search" placeholder="Search posts or categories..." onkeyup="filterPosts()" aria-label="Search posts">
    <span class="count" id="count">Loading...</span>
  </div>
</div>

<main id="catalogue">
</main>

<script>
  let allData = [];
  const API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTMJAx0AApXvyY-NclwVAHN6R77r9jhk9UEZa6qY8Ni6K2AhbSdqu78C5y7x0BAQe5zqmAtHlUPnIKKTBwfr25wwaI25GIPzUvtJhjwWJ9mHB1Ee1SiBpGPoaDOQqTABp866msSjx7nZM9usIEjCacIfaxEciDooh4EWJmp3MsW72YZOb6ufThQMLqcRcp9lQjMP2xtqYrnF6RcK5WbMy-mLxEjpHqp2x1oON07XWsIUAuMoEvDPSCsZdK7TZoFRoR3tW_Hf4Ci8tQLZxLDeHbM4UwqRQ&lib=MRFXtzx99QAmzJ6FdX3n5k3mEdTc-93DT'; // Replace with your Step 1 URL

  // Fetch data from the Google Sheet JSON endpoint on load
  fetch(API_URL)
    .then(response => response.json())
    .then(data => initApp(data))
    .catch(err => {
      document.getElementById('count').textContent = 'Error loading sheet data.';
      console.error(err);
    });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function initApp(data) {
    if (!data || data.length < 2) {
      document.getElementById('count').textContent = 'No data found.';
      return;
    }
    allData = data.slice(1); 
    renderCatalogue(allData);
  }

  function renderCatalogue(rows) {
    const catalogue = document.getElementById('catalogue');
    catalogue.innerHTML = '';

    const groups = {};
    rows.forEach(row => {
      const cat = row[0] ? String(row[0]).trim() : 'Uncategorized';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(row);
    });

    let totalPosts = 0;
    let totalCategories = Object.keys(groups).length;

    for (const [category, items] of Object.entries(groups)) {
      totalPosts += items.length;
      const sectionId = category.toLowerCase().replace(/[^a-z0-9]+/g, '-');

      let section = document.createElement('section');
      section.className = 'category-box';
      section.id = sectionId;

      let html = '<h2 class="category-header">' + escapeHtml(category) + ' <span>' + items.length + '</span></h2>' +
                 '<table><thead><tr><th>#</th><th>Post Title</th></tr></thead><tbody>';

      items.forEach((item, index) => {
        const sno = item[1] || (index + 1);
        const title = item[2] ? String(item[2]) : '';
        const slug = item[3] ? String(item[3]).trim() : '';
        const link = slug ? 'https://www.instagram.com/jaipurbound/p/' + encodeURIComponent(slug) + '/' : '#';
        
        const rawSearch = category.toLowerCase() + ' ' + title.toLowerCase();
        const searchText = escapeHtml(rawSearch);

        html += '<tr data-search="' + searchText + '">' +
                '<td>' + escapeHtml(sno) + '</td>' +
                '<td><a href="' + link + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(title) + '</a></td>' +
                '</tr>';
      });

      html += '</tbody></table>';
      section.innerHTML = html;
      catalogue.appendChild(section);
    }

    document.getElementById('count').textContent = totalPosts + ' posts · ' + totalCategories + ' categories';
  }

  function filterPosts() {
    const query = document.getElementById('search').value.trim().toLowerCase();
    const sections = document.querySelectorAll('.category-box');
    let visiblePosts = 0;
    let visibleCats = 0;

    sections.forEach(section => {
      const rows = section.querySelectorAll('tbody tr');
      let visibleInSection = 0;

      rows.forEach(row => {
        const textMatch = (row.getAttribute('data-search') || '').includes(query);
        row.hidden = !textMatch;
        if (textMatch) visibleInSection++;
      });

      section.hidden = visibleInSection === 0;
      if (visibleInSection > 0) visibleCats++;
      visiblePosts += visibleInSection;
      
      const badge = section.querySelector('.category-header span');
      if (badge) badge.textContent = visibleInSection;
    });

    document.getElementById('count').textContent = visiblePosts + ' posts · ' + visibleCats + ' categories';
  }
</script>

</body>
</html>
